name: Build MediaPocket for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpack
          $ff = Get-ChildItem ffmpeg-unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName ./ffmpeg.exe
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MediaPocket --add-binary "ffmpeg.exe;." --collect-all tkinterdnd2 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MediaPocket-Windows-x64
          path: dist/MediaPocket.exe
          if-no-files-found: error
